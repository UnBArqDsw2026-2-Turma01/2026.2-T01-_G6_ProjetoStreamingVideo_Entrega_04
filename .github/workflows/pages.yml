name: Deploy documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # O artefato é finalizado e, meio segundo depois, o deploy consulta a API;
      # sem essa espera a consulta devolve "Found 0 artifact(s)" (runs 45030029315 e 45030296538).
      - name: Aguardar o artefato ficar visível
        run: sleep 30

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
