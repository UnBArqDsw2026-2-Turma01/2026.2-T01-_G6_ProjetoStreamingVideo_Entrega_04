<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Streaming de Vídeo — Entrega 04 | Grupo 06</title>
  <meta name="description" content="Documentação da Entrega 04 do Grupo 06: Documento de Arquitetura (DAS) e IA Generativa. FGA0208, UnB, 2026.2.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4f46a8" id="meta-theme-color">
  <script>
    // Define o tema antes da primeira pintura, para não piscar claro → escuro.
    // Ordem: escolha salva pelo leitor > preferência do sistema > claro.
    (function () {
      var tema = null;
      try { tema = localStorage.getItem('g6-theme'); } catch (e) { /* armazenamento bloqueado: segue o sistema */ }
      if (tema !== 'light' && tema !== 'dark') {
        tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', tema);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="./assets/styles.css">
  <style>
    .sidebar .app-name { font-size: 1.2rem; }
  </style>
</head>
<body>
  <div id="app">Carregando a documentação da Entrega 04…</div>
  <noscript>Ative o JavaScript para navegar pela documentação ou consulte os arquivos Markdown no repositório.</noscript>
  <script>
    var ICONE_LUA = '<svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    var ICONE_SOL = '<svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

    function temaAtual() {
      return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    }

    function rotularBotao() {
      var botao = document.getElementById('g6-theme-toggle');
      if (!botao) return;
      var escuro = temaAtual() === 'dark';
      var texto = escuro ? 'Tema claro' : 'Tema escuro';
      botao.setAttribute('aria-label', 'Alternar para ' + texto.toLowerCase());
      botao.querySelector('.label').textContent = texto;
    }

    function aplicarTema(tema, salvar) {
      document.documentElement.setAttribute('data-theme', tema);
      var meta = document.getElementById('meta-theme-color');
      if (meta) meta.setAttribute('content', tema === 'dark' ? '#0f1117' : '#4f46a8');
      if (salvar) {
        try { localStorage.setItem('g6-theme', tema); } catch (e) { /* sem persistência: vale só nesta visita */ }
      }
      rotularBotao();
    }

    // O Mermaid desenha o SVG uma vez com o tema da hora; recarregar a rota é o jeito
    // mais simples de redesenhar com o tema novo. Só acontece em páginas com diagrama.
    function alternarTema() {
      aplicarTema(temaAtual() === 'dark' ? 'light' : 'dark', true);
      if (document.querySelector('.mermaid')) window.location.reload();
    }

    function pluginTema(hook) {
      hook.mounted(function () {
        var botao = document.createElement('button');
        botao.type = 'button';
        botao.id = 'g6-theme-toggle';
        botao.className = 'theme-toggle';
        botao.innerHTML = ICONE_LUA + ICONE_SOL + '<span class="label"></span>';
        botao.addEventListener('click', alternarTema);
        document.body.appendChild(botao);
        aplicarTema(temaAtual(), false);
      });
    }

    function pluginTabelas(hook) {
      function ajustar(wrapper) {
        wrapper.classList.remove('table-stacked');
        var tabela = wrapper.querySelector('table');
        if (tabela.scrollWidth > wrapper.clientWidth + 1) wrapper.classList.add('table-stacked');
      }

      function ajustarTodas() {
        document.querySelectorAll('.markdown-section .table-wrap').forEach(ajustar);
      }

      var temporizador;
      window.addEventListener('resize', function () {
        clearTimeout(temporizador);
        temporizador = setTimeout(ajustarTodas, 120);
      });

      hook.doneEach(function () {
        document.querySelectorAll('.markdown-section table').forEach(function (tabela) {
          if (tabela.parentElement && tabela.parentElement.classList.contains('table-wrap')) return;

          var cabecalhos = Array.prototype.map.call(
            tabela.querySelectorAll('thead th'),
            function (th) { return th.textContent.trim(); }
          );
          var linhas = tabela.querySelectorAll('tbody tr');

          // Rótulos para o modo cartão e detecção de colunas curtas.
          var compactas = cabecalhos.map(function () { return true; });
          linhas.forEach(function (tr) {
            Array.prototype.forEach.call(tr.children, function (td, i) {
              td.setAttribute('data-label', cabecalhos[i] || '');
              var texto = td.textContent.trim();
              if (texto.length > 16 || (cabecalhos[i] || '').length > 18) compactas[i] = false;
            });
          });
          compactas.forEach(function (ehCompacta, i) {
            if (!ehCompacta) return;
            tabela.querySelectorAll('tr').forEach(function (tr) {
              if (tr.children[i]) tr.children[i].classList.add('col-compact');
            });
          });

          var wrapper = document.createElement('div');
          wrapper.className = 'table-wrap';
          tabela.parentNode.insertBefore(wrapper, tabela);
          wrapper.appendChild(tabela);
          ajustar(wrapper);
        });
      });
    }

    // Sem escolha salva, acompanha a mudança de tema do sistema.
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        var salvo = null;
        try { salvo = localStorage.getItem('g6-theme'); } catch (err) { /* ignora */ }
        if (salvo === 'light' || salvo === 'dark') return;
        aplicarTema(e.matches ? 'dark' : 'light', false);
        if (document.querySelector('.mermaid')) window.location.reload();
      });
    }

    window.$docsify = {
      name: 'G6 · Streaming de Vídeo<br>Entrega 04',
      repo: 'https://github.com/UnBArqDsw2026-2-Turma01/2026.2-T01-_G6_ProjetoStreamingVideo_Entrega_04',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Buscar na documentação',
        noData: 'Nenhum resultado',
        depth: 3,
        pathNamespaces: ['/']
      },
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Erro',
        successText: 'Copiado'
      },
      pagination: {
        previousText: 'Anterior',
        nextText: 'Próxima',
        crossChapter: true,
        crossChapterText: true
      },
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      plugins: [pluginTema, pluginTabelas]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
  <script>mermaid.initialize({ startOnLoad: true, theme: temaAtual() === 'dark' ? 'dark' : 'default' });</script>
</body>
</html>
